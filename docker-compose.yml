# Week2 的向量库。`docker compose up -d` 起来即可，README 的复现步骤照抄这一条。
services:
  qdrant:
    image: qdrant/qdrant:v1.18.1   # 与 Qdrant.Client 1.18.1 对齐
    container_name: idr-qdrant
    ports:
      - "6333:6333"   # REST / 控制台 http://localhost:6333/dashboard
      - "6334:6334"   # gRPC，Qdrant.Client 走这个
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant-storage:
